[project]
name = "threadpull"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "faker==37.12.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "networkx>=3.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
